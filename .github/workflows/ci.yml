name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: awcluj_test
          MARIADB_USER: aw
          MARIADB_PASSWORD: aw-local-dev
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, zip, pdo_mysql, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dependențe
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          npm run build

      - name: Stil cod (Pint)
        run: vendor/bin/pint --test

      - name: Pregătire mediu
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/; s/^APP_DEBUG=.*/APP_DEBUG=true/' .env
          php artisan key:generate --no-interaction

      - name: Teste
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_DATABASE: awcluj_test
          DB_USERNAME: aw
          DB_PASSWORD: aw-local-dev
        run: php artisan test --compact

      - name: Audit dependențe
        run: |
          composer audit
          npm audit --omit=dev

  # Pachet pentru cPanel: vendor fără pachete de dezvoltare + resurse compilate, gata de încărcat.
  package:
    needs: tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, zip, pdo_mysql, bcmath
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Construire
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress
          npm ci && npm run build && rm -rf node_modules
      - name: Arhivă
        run: |
          zip -qr anotherworldcluj-${{ github.sha }}.zip . -x '.git/*' '.github/*' 'tests/*' 'storage/logs/*' 'storage/app/private/*' '.env'
      - uses: actions/upload-artifact@v4
        with:
          name: anotherworldcluj-cpanel
          path: anotherworldcluj-${{ github.sha }}.zip
          retention-days: 30
